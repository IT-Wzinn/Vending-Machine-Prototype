spring:
  datasource:
    url: jdbc:h2:mem:vending_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  machine:
    default-id: VM001
  cors:
    allowed-origin: http://localhost:5173
  order:
    expiration-minutes: 15
    cleanup-interval-ms: 60000
  payment:
    demo-mode: true
    bank-name: "DEMO - Ngân hàng Thử nghiệm"
    account-number: "DEMO123456"
    account-name: "DEMO SMART VENDING"
