server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: vending-machine-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vending_machine_dev}
    username: ${DATABASE_USERNAME:vending_user}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  machine:
    default-id: ${MACHINE_ID:VM001}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  order:
    expiration-minutes: ${ORDER_EXPIRATION_MINUTES:15}
    cleanup-interval-ms: ${ORDER_CLEANUP_INTERVAL_MS:60000}
  payment:
    demo-mode: ${PAYMENT_DEMO_MODE:true}
    provider: sepay
    sepay:
      api-key: ${SEPAY_API_KEY:}
      bank-bin: ${SEPAY_BANK_BIN:970422}
      bank-name: ${SEPAY_BANK_NAME:MBBank}
      account-number: ${SEPAY_ACCOUNT_NUMBER:DEMO123456}
      account-name: ${SEPAY_ACCOUNT_NAME:DEMO SMART VENDING}
  dispense:
    auto-trigger: ${DISPENSE_AUTO_TRIGGER:true}
    timeout-check-interval-ms: ${DISPENSE_TIMEOUT_CHECK_INTERVAL_MS:5000}
    command-timeout-seconds: ${DISPENSE_COMMAND_TIMEOUT_SECONDS:45}
    motor-run-ms: ${DISPENSE_MOTOR_RUN_MS:800}
    simulator:
      enabled: ${DISPENSE_SIMULATOR_ENABLED:true}
      async: ${DISPENSE_SIMULATOR_ASYNC:false}
      default-scenario: ${DISPENSE_SIMULATOR_DEFAULT_SCENARIO:SUCCESS}
